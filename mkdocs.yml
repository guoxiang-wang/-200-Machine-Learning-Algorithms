      - Z-score 标准化: 归一化方法/z-score.md
      - MaxAbs 缩放: 归一化方法/max-abs.md
      - 稳健缩放: 归一化方法/robust-scaler.md
      - 对数变换: 归一化方法/log-transform.md
      - 平方根变换: 归一化方法/sqrt-transform.md
      - Box-Cox 变换: 归一化方法/box-cox.md
      - 二值化: 归一化方法/binarization.md
  - 参数估计:
